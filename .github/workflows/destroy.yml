name: Destroy Infra

on:
  push:
    branches:
      - chkp-assignment-terragrunt
    paths-ignore:
      - '.github/workflows/main.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1

jobs:
  terragrunt-destroy:
    name: Terragrunt Destroy (Infra)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v1.2.0
        with:
          terragrunt_version: latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy CloudFront
        run: |
          cd terraform/terragrunt/cloudfront
          terragrunt destroy --non-interactive

      - name: Destroy S3
        run: |
          cd terraform/terragrunt/s3
          terragrunt destroy --non-interactive
