name: Deploy Infra and Run Python Code

on:
  push:
    branches:
      - chkp-assignment-terragrunt
    paths-ignore:
      - '.github/workflows/destroy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1

jobs:
  terragrunt:
    name: Terragrunt Apply (Infra)
    runs-on: ubuntu-latest

    outputs:
      bucket_name: ${{ steps.tg_outputs.outputs.bucket_name }}
      cloudfront_url: ${{ steps.tg_outputs.outputs.cloudfront_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v1.2.0
        with:
          terragrunt_version: latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt Init, Plan & Apply (All Modules)
        run: |
          cd terraform/terragrunt
          # Apply S3 first
          terragrunt init --terragrunt-working-dir s3 --non-interactive
          terragrunt plan --terragrunt-working-dir s3 -out=tfplan --non-interactive
          terragrunt apply --terragrunt-working-dir s3 --non-interactive
          # Apply CloudFront next (depends on S3)
          terragrunt init --terragrunt-working-dir cloudfront --non-interactive
          terragrunt plan --terragrunt-working-dir cloudfront -out=tfplan --non-interactive
          terragrunt apply --terragrunt-working-dir cloudfront --non-interactive

      - name: Capture Terragrunt Outputs
        id: tg_outputs
        run: |
          cd terraform/terragrunt
          BUCKET_NAME=$(terragrunt output -raw bucket_name --terragrunt-working-dir s3)
          CLOUDFRONT_URL=$(terragrunt output -raw cloudfront_domain_name --terragrunt-working-dir cloudfront)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "cloudfront_url=https://$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

  python:
    name: Python Data Processing
    runs-on: ubuntu-latest
    needs: terragrunt

    env:
      BUCKET_NAME: ${{ needs.terragrunt.outputs.bucket_name }}
      CLOUDFRONT_URL: ${{ needs.terragrunt.outputs.cloudfront_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r python/requirements.txt || pip install boto3 requests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Python Script
        run: python python/process_products.py
