name: Deploy Infra and Run Python Code

on:
  push:
    branches:
      - chkp-assignment
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1

jobs:
  terraform:
    name: Terraform Apply (Infra)
    runs-on: ubuntu-latest

    outputs:
      bucket_name: ${{ steps.tf_outputs.outputs.bucket_name }}
      cloudfront_url: ${{ steps.tf_outputs.outputs.cloudfront_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform Outputs
        id: tf_outputs
        run: |
          BUCKET_NAME=$(terraform output -raw bucket_name)
          CLOUDFRONT_URL=$(terraform output -raw cloudfront_distribution_domain)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "cloudfront_url=https://$CLOUDFRONT_URL" >> $GITHUB_OUTPUT

  python:
    name: Python Data Processing
    runs-on: ubuntu-latest
    needs: terraform

    env:
      AWS_REGION: ${{ env.AWS_REGION }}
      BUCKET_NAME: ${{ needs.terraform.outputs.bucket_name }}
      CLOUDFRONT_URL: ${{ needs.terraform.outputs.cloudfront_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Python Script
        run: python python/process_products.py
